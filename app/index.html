<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scarica FlightManager</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0f2569" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{ --blue:#1d4ed8; --sky:#0ea5e9; --ink:#0f172a; --sub:#475569; --card:#fff; --bg:#f8faff; }
  @media (prefers-color-scheme:dark){
    :root{ --ink:#e8eef7; --sub:#9db1c4; --card:#151f2a; --bg:#0b1017; }
  }
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); min-height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:28px; line-height:1.55;
  }
  .card{
    background:var(--card); border-radius:22px; padding:38px 30px; max-width:420px; width:100%;
    text-align:center; box-shadow:0 18px 50px rgba(15,23,42,.12);
  }
  .mark{
    width:84px; height:84px; margin:0 auto 22px; border-radius:22px;
    background:linear-gradient(135deg,var(--blue),var(--sky));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 22px rgba(29,78,216,.34);
  }
  .mark svg{width:46px;height:46px;fill:#fff}
  h1{font-size:1.42rem;font-weight:800;letter-spacing:-.4px;margin-bottom:8px}
  p{color:var(--sub);font-size:.95rem;margin-bottom:24px}
  .btn{
    display:block; background:var(--blue); color:#fff; text-decoration:none;
    border-radius:14px; padding:16px 20px; font-size:1.02rem; font-weight:700;
    box-shadow:0 6px 18px rgba(29,78,216,.32);
  }
  .hint{margin-top:20px;font-size:.82rem;color:var(--sub)}
  .hint b{color:var(--ink)}
  .back{display:inline-block;margin-top:18px;font-size:.85rem;color:var(--sub)}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24"><path d="M12 3.2c.95 0 1.6 1 1.6 2.3v3.7l7 4v1.7l-7-2v3.9l2.1 1.5v1.3L12 18.5l-3.7 1.1v-1.3l2.1-1.5v-3.9l-7 2v-1.7l7-4V5.5c0-1.3.65-2.3 1.6-2.3z"/></svg>
    </div>
    <h1 id="t">Apri FlightManager</h1>
    <p id="s">Ti porto sull'App Store.</p>
    <a class="btn" id="go" href="https://apps.apple.com/it/app/flightmanager/id6765693187">Apri nell'App Store</a>
    <p class="hint" id="h">Resta questa pagina? Tocca <b>⋯</b> in alto e scegli <b>Apri in Safari</b>.</p>
    <a class="back" href="/">← flight-manager.it</a>
  </div>

<script>
// Questa pagina esiste perche' il browser dentro Instagram, aprendo
// apps.apple.com, prova a passare la mano all'app App Store, non ci riesce e
// lascia una finestra bianca. Qui invece qualcosa si vede sempre: il rimando
// si tenta, ma se fallisce resta un bottone da toccare.
(function () {
  var ID = 'id6765693187';
  // Lo store del paese giusto si sceglie qui, senza il rimbalzo di Apple che
  // e' proprio cio' su cui quelle webview inciampano.
  var NOTI = { it:'it', es:'es', fr:'fr', de:'de', en:'us', pt:'pt', nl:'nl', pl:'pl', ro:'ro' };
  var lang = (navigator.language || 'it').slice(0, 2).toLowerCase();
  var store = NOTI[lang] || 'it';
  var url = 'https://apps.apple.com/' + store + '/app/flightmanager/' + ID;

  var go = document.getElementById('go');
  go.href = url;

  if (lang !== 'it') {
    document.getElementById('t').textContent = 'Open FlightManager';
    document.getElementById('s').textContent = 'Taking you to the App Store.';
    go.textContent = 'Open in the App Store';
    document.getElementById('h').innerHTML =
      'Still here? Tap <b>⋯</b> at the top and choose <b>Open in browser</b>.';
    document.documentElement.lang = 'en';
  }

  // Un attimo di attesa: se il rimando parte subito, chi arriva non fa in
  // tempo a vedere che c'e' un bottone nel caso non funzioni.
  setTimeout(function () { window.location.href = url; }, 700);
})();
</script>
</body>
</html>
